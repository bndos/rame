[package]
name = "rame"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["python"]

[lib]
name = "rame"
path = "src/lib.rs"

[dependencies]
hf-hub = { version = "1.0.0", features = ["blocking", "rustls-tls"], optional = true }
candle-core = "0.11.0"
half = { version = "2.7.1", optional = true }
metrics = { version = "0.24.6", optional = true }
ndarray = "0.17.2"
opencv = { version = "0.99.0", default-features = false, features = ["imgproc", "clang-runtime"], optional = true }
ort = { version = "2.0.0-rc.12", optional = true }
rayon = { version = "1.11.0", optional = true }
sentencepiece = "0.14.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2"
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"] }

[target.'cfg(target_os = "macos")'.dependencies]
mlx-rs = { git = "https://github.com/oxideai/mlx-rs.git", rev = "85b9d628d581802675d4afba52d94379663d17cc", features = ["safetensors"], optional = true }

[features]
huggingface = ["dep:hf-hub"]
onnxruntime = ["dep:ort"]
onnxruntime-cuda = ["onnxruntime", "ort/cuda"]
onnxruntime-tensorrt = ["onnxruntime-cuda", "ort/tensorrt"]
opencv = ["dep:opencv", "dep:rayon"]
metrics = ["dep:metrics"]
mlx = ["dep:mlx-rs", "dep:half"]

[[example]]
name = "pp_doclayout_plus_onnx"
required-features = ["huggingface", "onnxruntime", "opencv"]

[[example]]
name = "parakeet_mlx"
required-features = ["mlx"]

[dev-dependencies]
clap = { version = "4.6.1", features = ["derive"] }
hound = "3.5.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
tabled = "0.21.0"
