[project]
name = "rame-benchmarks"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "datasets>=3.0.0",
  "huggingface-hub>=1.0.1",
  "pillow>=12.0.0",
  "rich>=14.2.0",
  "typer>=0.20.0",
]

[project.scripts]
rame-bench = "rame_benchmarks.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
paddle-cpu = ["paddlepaddle==3.3.0", "paddlex[ocr]>=3.4.0,<3.5.0"]
paddle-cu126 = ["paddlepaddle-gpu==3.3.0", "paddlex[ocr]>=3.4.0,<3.5.0"]
paddle-cu129 = ["paddlepaddle-gpu==3.3.0", "paddlex[ocr]>=3.4.0,<3.5.0"]
paddle-cu130 = ["paddlepaddle-gpu==3.3.0", "paddlex[ocr]>=3.4.0,<3.5.0"]

[dependency-groups]
dev = ["ruff>=0.14.0"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "PLC0415"]

[tool.uv]
conflicts = [
  [
    { extra = "paddle-cpu" },
    { extra = "paddle-cu126" },
    { extra = "paddle-cu129" },
    { extra = "paddle-cu130" },
  ],
]

[tool.uv.sources]
paddlepaddle = { index = "paddle-cpu", extra = "paddle-cpu" }
paddlepaddle-gpu = [
  { index = "paddle-cu126", extra = "paddle-cu126" },
  { index = "paddle-cu129", extra = "paddle-cu129" },
  { index = "paddle-cu130", extra = "paddle-cu130" },
]

[[tool.uv.index]]
name = "paddle-cpu"
url = "https://www.paddlepaddle.org.cn/packages/stable/cpu/"
explicit = true

[[tool.uv.index]]
name = "paddle-cu126"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu126/"
explicit = true

[[tool.uv.index]]
name = "paddle-cu129"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu129/"
explicit = true

[[tool.uv.index]]
name = "paddle-cu130"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu130/"
explicit = true
