[project]
name = "rame-benchmarks"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "datasets>=3.0.0",
  "huggingface-hub>=1.0.1",
  "numpy>=1.24,<2.4",
  "omegaconf>=2.3.0",
  "pydantic>=2.12.0",
  "pillow>=12.0.0",
  "rich>=14.2.0",
  "typer>=0.20.0",
]

[project.scripts]
rame-bench = "rame_benchmarks.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[project.optional-dependencies]
rame = ["rame"]
paddle-cpu = ["paddlepaddle==3.3.0", "paddlex[ocr]==3.7.2"]
paddle-hpi-cpu = [
  "paddle2onnx==2.0.2rc3",
  "paddlepaddle==3.3.0",
  "paddlex[ocr]==3.7.2",
  "ultra-infer-python @ https://paddle-model-ecology.bj.bcebos.com/paddlex/PaddleX3.0/deploy/hpi/ultra_infer/releases/new_hpi/v1.2.0/ultra_infer_python-1.2.0-cp311-cp311-linux_x86_64.whl ; python_version == '3.11' and platform_system == 'Linux' and platform_machine == 'x86_64'",
  "ultra-infer-python @ https://paddle-model-ecology.bj.bcebos.com/paddlex/PaddleX3.0/deploy/hpi/ultra_infer/releases/new_hpi/v1.2.0/ultra_infer_python-1.2.0-cp312-cp312-linux_x86_64.whl ; python_version == '3.12' and platform_system == 'Linux' and platform_machine == 'x86_64'",
]
paddle-cu118 = ["paddlepaddle-gpu==3.3.0", "paddlex[ocr]==3.7.2"]
paddle-hpi-gpu-cu118 = [
  "nvidia-nvjpeg-cu11==11.9.0.86",
  "paddle2onnx==2.0.2rc3",
  "paddlepaddle-gpu==3.3.0",
  "paddlex[ocr]==3.7.2",
  "ultra-infer-gpu-python @ https://paddle-model-ecology.bj.bcebos.com/paddlex/PaddleX3.0/deploy/hpi/ultra_infer/releases/new_hpi/v1.2.0/ultra_infer_gpu_python-1.2.0-cp311-cp311-linux_x86_64.whl ; python_version == '3.11' and platform_system == 'Linux' and platform_machine == 'x86_64'",
  "ultra-infer-gpu-python @ https://paddle-model-ecology.bj.bcebos.com/paddlex/PaddleX3.0/deploy/hpi/ultra_infer/releases/new_hpi/v1.2.0/ultra_infer_gpu_python-1.2.0-cp312-cp312-linux_x86_64.whl ; python_version == '3.12' and platform_system == 'Linux' and platform_machine == 'x86_64'",
]
paddle-cu126 = ["paddlepaddle-gpu==3.3.0", "paddlex[ocr]==3.7.2"]
paddle-cu129 = ["paddlepaddle-gpu==3.3.0", "paddlex[ocr]==3.7.2"]
paddle-cu130 = ["paddlepaddle-gpu==3.3.0", "paddlex[ocr]==3.7.2"]

[dependency-groups]
dev = []

[tool.ruff.lint]
select = ["ARG", "E4", "E7", "E9", "F", "I", "PLC0415", "RUF022"]

[tool.uv]
conflicts = [
  [
    { extra = "paddle-cpu" },
    { extra = "paddle-hpi-cpu" },
    { extra = "paddle-cu118" },
    { extra = "paddle-hpi-gpu-cu118" },
    { extra = "paddle-cu126" },
    { extra = "paddle-cu129" },
    { extra = "paddle-cu130" },
  ],
]

[tool.uv.sources]
rame = { workspace = true, extra = "rame" }
paddlepaddle = { index = "paddle-cpu", extra = "paddle-cpu" }
paddlepaddle-gpu = [
  { index = "paddle-cu118", extra = "paddle-cu118" },
  { index = "paddle-cu118", extra = "paddle-hpi-gpu-cu118" },
  { index = "paddle-cu126", extra = "paddle-cu126" },
  { index = "paddle-cu129", extra = "paddle-cu129" },
  { index = "paddle-cu130", extra = "paddle-cu130" },
]

[[tool.uv.index]]
name = "paddle-cpu"
url = "https://www.paddlepaddle.org.cn/packages/stable/cpu/"
explicit = true

[[tool.uv.index]]
name = "paddle-cu118"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu118/"
explicit = true

[[tool.uv.index]]
name = "paddle-cu126"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu126/"
explicit = true

[[tool.uv.index]]
name = "paddle-cu129"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu129/"
explicit = true

[[tool.uv.index]]
name = "paddle-cu130"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu130/"
explicit = true
