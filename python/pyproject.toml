[project]
name = "rame"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[build-system]
requires = ["maturin>=1.14.1,<2"]
build-backend = "maturin"

[tool.maturin]
python-source = "."
module-name = "rame._native"
bindings = "pyo3"

[dependency-groups]
dev = [
  "debugpy>=1.8.21",
  "ruff>=0.16.1",
  "ty>=0.0.69",
]
