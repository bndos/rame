[package]
name = "rame"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["python"]

[lib]
name = "rame"
path = "src/lib.rs"

[dependencies]
hf-hub = { version = "1.0.0", features = ["blocking", "rustls-tls"], optional = true }
metrics = { version = "0.24.6", optional = true }
ndarray = "0.17.2"
opencv = { version = "0.99.0", default-features = false, features = ["imgproc", "clang-runtime"], optional = true }
ort = { version = "2.0.0-rc.12", optional = true }
rayon = { version = "1.11.0", optional = true }
thiserror = "2"

[features]
huggingface = ["dep:hf-hub"]
onnxruntime = ["dep:ort"]
onnxruntime-cuda = ["onnxruntime", "ort/cuda"]
onnxruntime-tensorrt = ["onnxruntime-cuda", "ort/tensorrt"]
opencv = ["dep:opencv", "dep:rayon"]
metrics = ["dep:metrics"]

[[example]]
name = "pp_doclayout_plus_onnx"
required-features = ["huggingface", "onnxruntime", "opencv"]

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
tabled = "0.21.0"
