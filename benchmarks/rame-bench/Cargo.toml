[package]
name = "rame-bench"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
metrics = { version = "0.24.6", optional = true }
metrics-exporter-tracing = { version = "0.1.0", optional = true }
rame = { version = "0.1.0", path = "../..", features = ["huggingface", "onnxruntime", "opencv"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tracing-subscriber = { version = "0.3.23", features = ["json"], optional = true }
walkdir = "2.5.0"

[features]
profile = [
    "dep:metrics",
    "dep:metrics-exporter-tracing",
    "dep:tracing-subscriber",
    "rame/metrics",
]

[dev-dependencies]
tempfile = "3.27.0"
