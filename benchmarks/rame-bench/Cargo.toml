[package]
name = "rame-bench"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
rame = { version = "0.1.0", path = "../..", features = ["huggingface", "onnxruntime", "opencv"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"
