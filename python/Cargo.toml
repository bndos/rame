[package]
name = "rame-python"
version = "0.1.0"
edition = "2024"

[lib]
name = "_native"
crate-type = ["cdylib"]

[features]
default = ["cpu"]
cpu = ["dep:rame", "rame/huggingface", "rame/onnxruntime", "rame/opencv"]
cuda = ["cpu", "rame/onnxruntime-cuda"]
tensorrt = ["cuda", "rame/onnxruntime-tensorrt"]

[dependencies]
numpy = { version = "0.29" }
rayon = "1.11.0"
pyo3 = { version = "0.29.2", features = ["extension-module"] }
rame = { path = "..", default-features = false, optional = true }

[build-dependencies]
pyo3-build-config = "0.29.2"
